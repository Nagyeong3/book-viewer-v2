name: Backend tests

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: python -m pip install -e "backend[dev]"
      - name: Compile backend
        run: python -m compileall -q backend/app backend/tests backend/scripts
      - name: Run tests
        run: python -m pytest -q
